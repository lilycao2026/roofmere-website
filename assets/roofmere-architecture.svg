<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc"><title id="title">Roofmere software architecture</title><desc id="desc">Local Free and Local Pro run in the browser and save financial data in IndexedDB. Private Cloud uses the household's Netlify Functions and Supabase project for authentication, PostgreSQL and private document storage. Pro is currently a test build.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#78479a" stroke-width="1.3"/></marker></defs><rect width="1440" height="1190" fill="#f5f3f7"/><text x="48" y="53" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#5f2d86" font-weight="700">ROOFMERE</text><text x="48" y="105" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#17141b" font-weight="700">Your data. Your infrastructure.</text><text x="48" y="141" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#726b78" font-weight="400">Privacy-first household finance • Your wealth. Your knowledge. Your future.</text><rect x="48" y="181" width="568" height="771" rx="16" fill="#fcfafd" stroke="#e1d7e8"/><rect x="640" y="181" width="752" height="771" rx="16" fill="#fcfafd" stroke="#e1d7e8"/><text x="76" y="224" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#5f2d86" font-weight="700">Local Free / Local Pro</text><text x="76" y="254" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#726b78" font-weight="400">Financial data stays in your browser.</text><text x="668" y="224" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#5f2d86" font-weight="700">Private Cloud</text><text x="668" y="254" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#726b78" font-weight="400">Your own Netlify + Supabase accounts.</text><rect x="72" y="278" width="520" height="507" rx="16" fill="#f0e9f4" stroke="#d4bddf"/><text x="94" y="307" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5f2d86" font-weight="700">USER’S DEVICE • CURRENT BROWSER PROFILE</text><rect x="94" y="326" width="476" height="119" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="116" y="354" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">FRONTEND</text><text x="116" y="383" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">HTML / CSS / JavaScript</text><text x="116" y="410" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Shared dashboard, views and calculations</text><path d="M332 454 L332 481" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="351" y="474" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">In-browser calls</text><rect x="94" y="490" width="476" height="119" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="116" y="518" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">APPLICATION LOGIC</text><text x="116" y="547" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">Browser JavaScript engine</text><text x="116" y="574" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Shared request handlers + in-memory data model</text><text x="116" y="597" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">No remote application backend</text><path d="M332 619 L332 649" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="351" y="640" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">Read / save</text><rect x="94" y="658" width="476" height="105" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="116" y="686" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">DATABASE</text><text x="116" y="715" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">IndexedDB</text><text x="116" y="742" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Financial records stored on this device</text><text x="94" y="820" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17141b" font-weight="700">Authentication: no sign-in</text><text x="94" y="849" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17141b" font-weight="700">Document storage: no Document Vault</text><text x="94" y="882" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Manual JSON backup / restore to your own files.</text><text x="94" y="907" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">No automatic cross-device sync. Back up regularly.</text><text x="94" y="932" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#726b78" font-weight="400">Browser data can be cleared; capacity varies.</text><rect x="664" y="278" width="704" height="642" rx="16" fill="#f0e9f4" stroke="#d4bddf"/><text x="686" y="307" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5f2d86" font-weight="700">HOUSEHOLD-MANAGED CLOUD SERVICES</text><rect x="686" y="326" width="382" height="119" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="708" y="354" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">FRONTEND • USER’S BROWSER</text><text x="708" y="383" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">HTML / CSS / JavaScript</text><text x="708" y="410" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Static app served by your Netlify site</text><rect x="1110" y="326" width="236" height="119" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="1132" y="354" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">AUTHENTICATION</text><text x="1132" y="383" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">Supabase Auth</text><text x="1132" y="410" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Email / password</text><text x="1132" y="433" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Session tokens</text><path d="M1075 388 L1103 388" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1080" y="365" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#726b78" font-weight="400">Login</text><path d="M877 454 L877 521" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="895" y="485" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">HTTPS API</text><text x="895" y="504" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">+ session token</text><rect x="686" y="530" width="382" height="142" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="708" y="558" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">BACKEND • YOUR NETLIFY</text><text x="708" y="587" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">Netlify Functions</text><text x="708" y="614" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Validate session + allowed email</text><text x="708" y="637" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Check household access</text><text x="708" y="660" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Finance, cash flow, history, Vault</text><path d="M1068 552 L1090 552 L1090 471 L1228 471 L1228 453" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)"/><text x="1111" y="499" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">Validate user</text><path d="M877 681 L877 749" fill="none" stroke="#78479a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="895" y="712" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">Supabase REST API</text><text x="895" y="734" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#726b78" font-weight="400">Read / write</text><rect x="686" y="758" width="382" height="138" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="708" y="786" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">DATABASE • YOUR SUPABASE</text><text x="708" y="815" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">PostgreSQL</text><text x="708" y="842" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Household financial records</text><text x="708" y="865" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">History, notes and plans</text><text x="708" y="888" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Document metadata</text><rect x="1110" y="758" width="236" height="138" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="1132" y="786" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#78479a" font-weight="700">FILES • YOUR SUPABASE</text><text x="1132" y="815" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#17141b" font-weight="700">Supabase Storage</text><text x="1132" y="842" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Private family-vault</text><text x="1132" y="865" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Document files</text><path d="M1068 626 L1154 626 L1154 749" fill="none" stroke="#78479a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1169" y="616" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#726b78" font-weight="400">Signed upload /</text><text x="1169" y="638" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#726b78" font-weight="400">download access</text><path d="M1036 445 L1036 459 L1357 459 L1357 723 L1284 723 L1284 749" fill="none" stroke="#78479a" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1130" y="699" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#5f2d86" font-weight="700">Direct file transfer</text><text x="686" y="944" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Authorized family members use the same cloud data across devices.</text><rect x="48" y="974" width="1344" height="77" rx="16" fill="#fff" stroke="#e1d7e8"/><text x="72" y="1004" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5f2d86" font-weight="700">AI-READY EXPORT • LOCAL PRO + PRIVATE CLOUD</text><text x="72" y="1032" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17141b" font-weight="400">Choose data + privacy level → Generate prompt / export → You copy or download it for an external AI.</text><text x="48" y="1080" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5f2d86" font-weight="700">CURRENT STATUS</text><text x="48" y="1108" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Local Free: 10 accounts / 1 property. Local Pro: unlimited; test build only, license and trial pending.</text><text x="48" y="1133" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#726b78" font-weight="400">Local offline installation is planned. No built-in AI assistant. Cloud data is hosted by your chosen providers.</text><text x="48" y="1170" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#726b78" font-weight="400">Program libraries (sign-in, screenshot reader) load from jsDelivr; no financial data is sent to them. • Diagram as of October 2026</text></svg>