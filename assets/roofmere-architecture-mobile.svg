<svg xmlns="http://www.w3.org/2000/svg" width="720" height="3040" viewBox="0 0 720 3040" role="img" aria-labelledby="mt md"><title id="mt">Roofmere software architecture (phone layout)</title><desc id="md">Local Free and Local Pro run in the browser and save financial data in IndexedDB. Private Cloud signs in with Supabase Auth, calls the household's Netlify Functions, which read and write PostgreSQL; document files move directly between the browser and private Supabase Storage with signed links.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#78479a" stroke-width="2"/></marker></defs><rect width="720" height="3040" fill="#f5f3f7"/><text x="40" y="60" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#5f2d86" font-weight="700" text-anchor="start">ROOFMERE</text><text x="40" y="112" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#17141b" font-weight="700" text-anchor="start">How Roofmere works</text><text x="40" y="152" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#726b78" font-weight="400" text-anchor="start">Where your financial records live.</text><rect x="24" y="196" width="672" height="970" rx="18" fill="#fcfafd" stroke="#e1d7e8" stroke-width="2"/><text x="52" y="252" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#5f2d86" font-weight="700" text-anchor="start">Local Free / Local Pro</text><text x="52" y="290" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#726b78" font-weight="400" text-anchor="start">Financial data stays in your browser.</text><rect x="44" y="320" width="632" height="698" rx="18" fill="#f0e9f4" stroke="#d4bddf" stroke-width="2"/><text x="68" y="360" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5f2d86" font-weight="700" text-anchor="start">YOUR DEVICE • THIS BROWSER</text><rect x="68" y="380" width="584" height="150" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="94" y="418" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#78479a" font-weight="700" text-anchor="start">FRONTEND</text><text x="94" y="456" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#17141b" font-weight="700" text-anchor="start">HTML / CSS / JavaScript</text><text x="94" y="492" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Dashboard, views and calculations</text><path d="M360 538 L360 588" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/><text x="380" y="571.0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">In-browser calls</text><rect x="68" y="596" width="584" height="182" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="94" y="634" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#78479a" font-weight="700" text-anchor="start">APPLICATION LOGIC</text><text x="94" y="672" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#17141b" font-weight="700" text-anchor="start">Browser JavaScript engine</text><text x="94" y="708" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Same request handlers as Cloud</text><text x="94" y="740" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">No remote application backend</text><path d="M360 786 L360 836" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/><text x="380" y="819.0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Read / save</text><rect x="68" y="844" width="584" height="150" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="94" y="882" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#78479a" font-weight="700" text-anchor="start">DATABASE</text><text x="94" y="920" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#17141b" font-weight="700" text-anchor="start">IndexedDB</text><text x="94" y="956" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Financial records on this device</text><text x="52" y="1064" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#17141b" font-weight="700" text-anchor="start">No sign-in • No Document Vault</text><text x="52" y="1098" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Back up to your own files and restore from them.</text><text x="52" y="1132" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Devices do not sync. Browser data can be cleared.</text><rect x="24" y="1196" width="672" height="1442" rx="18" fill="#fcfafd" stroke="#e1d7e8" stroke-width="2"/><text x="52" y="1252" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#5f2d86" font-weight="700" text-anchor="start">Private Cloud</text><text x="52" y="1290" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#726b78" font-weight="400" text-anchor="start">Your own Netlify + Supabase accounts.</text><rect x="44" y="1320" width="632" height="1180" rx="18" fill="#f0e9f4" stroke="#d4bddf" stroke-width="2"/><text x="68" y="1360" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5f2d86" font-weight="700" text-anchor="start">CLOUD SERVICES YOUR HOUSEHOLD OWNS</text><rect x="68" y="1380" width="584" height="150" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="94" y="1418" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#78479a" font-weight="700" text-anchor="start">FRONTEND • YOUR BROWSER</text><text x="94" y="1456" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#17141b" font-weight="700" text-anchor="start">HTML / CSS / JavaScript</text><text x="94" y="1492" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Served by your Netlify site</text><rect x="150" y="1580" width="502" height="168" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="172" y="1616" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#78479a" font-weight="700" text-anchor="start">① SIGN IN</text><text x="172" y="1652" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#17141b" font-weight="700" text-anchor="start">Supabase Auth</text><text x="172" y="1686" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Email / password</text><text x="172" y="1716" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Session token for each request</text><path d="M86 1530 L86 1664 L146 1664" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)"/><rect x="150" y="1782" width="502" height="228" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="172" y="1818" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#78479a" font-weight="700" text-anchor="start">② API CALLS + SESSION TOKEN</text><text x="172" y="1854" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#17141b" font-weight="700" text-anchor="start">Netlify Functions</text><text x="172" y="1888" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Check the token (with Auth)</text><text x="172" y="1918" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">and the allowed e-mail</text><text x="172" y="1948" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Check household access</text><text x="172" y="1978" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Finance, cash flow, history, Vault</text><path d="M106 1530 L106 1866 L146 1866" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)"/><path d="M401 2018 L401 2068" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/><text x="421" y="2051.0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Read / write</text><rect x="150" y="2076" width="502" height="168" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="172" y="2112" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#78479a" font-weight="700" text-anchor="start">DATABASE • YOUR SUPABASE</text><text x="172" y="2148" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#17141b" font-weight="700" text-anchor="start">PostgreSQL</text><text x="172" y="2182" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Records, history, notes</text><text x="172" y="2212" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Document list (metadata)</text><rect x="150" y="2278" width="502" height="198" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="172" y="2314" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#78479a" font-weight="700" text-anchor="start">③ FILES, WITH A SIGNED LINK</text><text x="172" y="2350" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#17141b" font-weight="700" text-anchor="start">Supabase Storage</text><text x="172" y="2384" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Private family vault</text><text x="172" y="2414" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">Functions issue the link; files move</text><text x="172" y="2444" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#726b78" font-weight="400" text-anchor="start">directly to and from your browser</text><path d="M126 1530 L126 2362 L146 2362" fill="none" stroke="#78479a" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 7"/><text x="52" y="2542" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Your browser talks to these three services</text><text x="52" y="2574" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">directly. Authorized family members use the</text><text x="52" y="2606" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">same data across devices.</text><rect x="24" y="2668" width="672" height="150" rx="18" fill="#fff" stroke="#e1d7e8" stroke-width="2"/><text x="52" y="2710" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5f2d86" font-weight="700" text-anchor="start">AI-READY EXPORT • LOCAL PRO + PRIVATE CLOUD</text><text x="52" y="2752" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#17141b" font-weight="400" text-anchor="start">Choose data and privacy level → export →</text><text x="52" y="2786" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#17141b" font-weight="400" text-anchor="start">you copy it to an AI you choose.</text><text x="40" y="2864" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5f2d86" font-weight="700" text-anchor="start">CURRENT STATUS</text><text x="40" y="2898" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Local Free: 10 accounts, 1 property.</text><text x="40" y="2932" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">Local Pro: licensing and trial pending.</text><text x="40" y="2966" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">No built-in AI assistant. Program libraries load</text><text x="40" y="3000" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#726b78" font-weight="400" text-anchor="start">from jsDelivr; no financial data is sent to them.</text></svg>