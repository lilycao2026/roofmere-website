name: Sitemap health

on:
  push:
    branches: [main]
    paths:
      - sitemap.xml
      - robots.txt
      - scripts/check_sitemap.py
      - .github/workflows/sitemap-health.yml
  pull_request:
    paths:
      - sitemap.xml
      - robots.txt
      - scripts/check_sitemap.py
      - .github/workflows/sitemap-health.yml
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sitemap XML
        run: python scripts/check_sitemap.py
      - name: Check live GitHub Pages (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_sitemap.py --live
